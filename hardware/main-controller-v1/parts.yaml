# Azul Main Controller v1 — Bill of Materials + Verification Ledger
# Source of truth for LCSC part number assignments AND datasheet-audit state.
# Grouped by (Value, Footprint) → refs; matches Fabrication Toolkit BOM output.
#
# fate:
#   smt  → JLC assembles at PCBA time; LCSC field must be populated in schematic.
#   dnp  → Do Not Populate; hand-soldered after JLC delivery from parts on hand.
#
# lcsc:
#   populated for JLC-assembled parts; unset for DNP.
#   Extended parts incur a $3 one-time setup fee at JLC PCBA.
#
# verification:
#   status: verified | unverified | blocked | bench_check_pending
#     verified            → symbol + footprint + net-probe all pass against datasheet
#     unverified          → not yet audited this rev — RUN before regenerating fab package
#     blocked             → missing datasheet / other prerequisite
#     bench_check_pending → design verified; requires DVT on physical part after delivery
#   date                  → YYYY-MM-DD when verification block was last updated
#   symbol                → schematic-symbol pin numbers vs datasheet pin function (pass/fail/n_a)
#   footprint             → pad coords, pitch, drill, tab wiring vs datasheet mechanical drawing (pass/fail)
#   nets                  → pcbnew net-probe: schematic net on each pad matches intended design (pass/fail/not_probed)
#   datasheet             → repo-relative path to the source of truth (if on disk)
#   notes                 → what was checked, what is deferred, historical context

