      notes: |
        REAL BUG FOUND + FIXED 2026-07-11 during rev1 Phase 2 audit. Original D1 placement was ACROSS 24VAC input — 33V standoff too close to real 27.5VAC RMS wall wart peaks (~38V), would have conducted every AC cycle, self-heated, failed short → PTC trips → dead controller.
        Fix applied: moved D1 from AC side to DC side. D1 pad 2 → +VRAW (D2 pad 4), D1 pad 1 → GND. Short clamp loop near C6, bonded to B.Cu GND plane. DRC clean.
        Bidirectional TVS (CA suffix) is non-polar so no orientation risk. See ORDER_STATUS.md Phase 2 + [[project_d2_bridge_rectifier_silkscreen]] context.

