[platformio]
; Default target when `pio run` / `pio run -t upload` is invoked without -e.
; Bench work happens on rev2 hardware — override with -e for dev-kit builds.
default_envs = esp32-s3-rev2

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I test/test_zone_controller
build_src_filter = +<ZoneController.cpp>

[env:native_scheduler]
platform = native
test_framework = unity
test_filter = test_scheduler
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I test/test_scheduler

; Shared config for all ESP32-S3 firmware builds. Not a build target itself —
; use one of the concrete envs below. Every real env must define exactly one
; BOARD_VARIANT_* macro so BoardPins.h can select the correct pin map.
[esp32-s3-common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_azul.csv
monitor_speed = 115200
monitor_eol = LF
monitor_filters = esp32_exception_decoder
upload_protocol = esp-builtin
extra_scripts = pre:scripts/inject_version.py
; Firmware version is read from include/version.h by inject_version.py.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DASYNC_WEBSERVER_REGEX=1
    -DASYNCWEBSERVER_REGEX=1
lib_deps =
    jgromes/RadioLib@^6.0.0
    adafruit/Adafruit NeoPixel@^1.12.3
    ESP32Async/AsyncTCP@^3.4.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.3
    knolleary/PubSubClient@^2.8

; ESP32-S3-DevKitC-1 (development / prototype board).
; Onboard WS2812 RGB LED on GPIO 48.
[env:esp32-s3-devkit]
extends = esp32-s3-common
build_flags =
    ${esp32-s3-common.build_flags}
    -DBOARD_VARIANT_DEVKIT

; Azul main-controller rev2 PCB (production hardware).
; WS2812B status LED (silkscreen D5) on GPIO 21.
[env:esp32-s3-rev2]
extends = esp32-s3-common
build_flags =
    ${esp32-s3-common.build_flags}
    -DBOARD_VARIANT_REV2

[env:esp32-s3-devkit-debug]
extends = env:esp32-s3-devkit
build_flags =
    ${env:esp32-s3-devkit.build_flags}
    -DDEBUG_BUILD

[env:esp32-s3-rev2-debug]
extends = env:esp32-s3-rev2
build_flags =
    ${env:esp32-s3-rev2.build_flags}
    -DDEBUG_BUILD
